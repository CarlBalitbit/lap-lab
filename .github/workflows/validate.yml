name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build simulator and validators
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found' }
          New-Item -ItemType Directory -Force build | Out-Null
          @"
          @echo off
          call "$installation\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 f1_track_sim.cpp /Fe:build\f1_track_sim.exe /Fo:build\f1_track_sim.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 tools\validate_circuits.cpp /Fe:build\validate_circuits.exe /Fo:build\validate_circuits.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 tools\validate_races.cpp /Fe:build\validate_races.exe /Fo:build\validate_races.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 tools\validate_physics.cpp /Fe:build\validate_physics.exe /Fo:build\validate_physics.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 tools\validate_convergence.cpp /Fe:build\validate_convergence.exe /Fo:build\validate_convergence.obj
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ascii build\compile.cmd
          & cmd /c build\compile.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate all circuit profiles
        shell: pwsh
        run: |
          & .\build\validate_circuits.exe .\tracks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate continuous races
        shell: pwsh
        run: |
          & .\build\validate_races.exe .\tracks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify analytical physics
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & .\build\validate_physics.exe
          $validationExit = $LASTEXITCODE
          Write-Output "Analytical validation runtime: $($timer.Elapsed.TotalSeconds) s"
          if ($validationExit -ne 0) { exit $validationExit }
      - name: Verify blocking convergence invariants and report diagnostic accuracy targets
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          # Never use continue-on-error: execution/invariant failures must block CI.
          & .\build\validate_convergence.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\validate_convergence.exe .\tracks
          $validationExit = $LASTEXITCODE
          Write-Output "Convergence validation runtime: $($timer.Elapsed.TotalSeconds) s"
          Write-Output "Provisional accuracy exceedances are diagnostic; mandatory failures return nonzero."
          if ($validationExit -ne 0) { exit $validationExit }
      - name: Test Windows release packaging
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
              $LASTEXITCODE = 0
              $result = & .\tools\test_package_windows.ps1 -ExecutablePath .\build\f1_track_sim.exe
              $packagingExit = $LASTEXITCODE
              if ($packagingExit -ne 0) {
                  throw "Packaging test process failed with exit code $packagingExit."
              }
              if (@($result).Count -ne 1 -or $result.Checks -ne 27) {
                  throw "Expected one result confirming all 27 packaging checks passed."
              }
              $result | Format-List
          }
          finally {
              Write-Output "Packaging test runtime: $($timer.Elapsed.TotalSeconds) s"
          }
      - name: Generate verified Windows CI package
        id: windows_package
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
              if ($env:GITHUB_RUN_ID -notmatch '^\d+$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^\d+$') {
                  throw 'Invalid workflow run/attempt identifiers.'
              }
              $outputDirectory = "build/ci-artifacts/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
              if (Test-Path -LiteralPath $outputDirectory) {
                  throw 'CI output directory already exists; refusing to reuse it.'
              }
              $LASTEXITCODE = 0
              $package = & .\tools\package_windows.ps1 -ExecutablePath .\build\f1_track_sim.exe -OutputDirectory $outputDirectory
              if ($LASTEXITCODE -ne 0) { throw "Package generation failed with exit code $LASTEXITCODE." }
              if (@($package).Count -ne 1 -or $package.Files -ne 50) { throw 'Invalid packaging result.' }
              foreach ($path in @($package.ZipPath, $package.ChecksumPath)) {
                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package output: $path" }
              }
              $verified = & .\tools\package_windows.ps1 -ExecutablePath .\build\f1_track_sim.exe -VerifyOnly -ArchivePath $package.ZipPath
              if ($LASTEXITCODE -ne 0 -or @($verified).Count -ne 1 -or -not $verified.Verified -or $verified.Files -ne 50) {
                  throw 'Package content verification failed.'
              }
              $hash = (Get-FileHash -LiteralPath $package.ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $expectedChecksum = "$hash  $([IO.Path]::GetFileName($package.ZipPath))`n"
              if ($package.SHA256 -cne $hash -or [IO.File]::ReadAllText($package.ChecksumPath) -cne $expectedChecksum) {
                  throw 'Package SHA-256/checksum mismatch.'
              }
              "zip_path=$($package.ZipPath)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "checksum_path=$($package.ChecksumPath)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              $package | Format-List
          }
          finally {
              Write-Output "CI package generation runtime: $($timer.Elapsed.TotalSeconds) s"
          }
      - name: Upload Windows CI package and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lap-lab-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.windows_package.outputs.zip_path }}
            ${{ steps.windows_package.outputs.checksum_path }}
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14
